# HRIS di Ubuntu. Port host 8020 (8004, 8010–8012, 8090, 9090, 9116 sudah terpakai).
# Pertama kali dan update:
#   git pull
#   docker compose up -d --build
# Cek: curl -fsS http://127.0.0.1:8020/api/v1/health/

name: hris

services:
  mysql:
    image: mysql:8.0
    container_name: hris-mysql
    restart: unless-stopped
    env_file:
      - ops/docker/compose.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hris_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: hris-system:local
    container_name: hris-web
    restart: unless-stopped
    env_file:
      - ops/docker/compose.env
    ports:
      - "${HRIS_PORT:-8020}:8000"
    volumes:
      - hris_media:/app/media
      - hris_audit:/app/audit_archive
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    build: .
    image: hris-system:local
    container_name: hris-worker
    restart: unless-stopped
    env_file:
      - ops/docker/compose.env
    entrypoint: ["/app/docker/entrypoint-worker.sh"]
    volumes:
      - hris_media:/app/media
      - hris_audit:/app/audit_archive
    depends_on:
      web:
        condition: service_healthy

volumes:
  hris_mysql_data:
    name: hris_mysql_data
  hris_media:
    name: hris_media
  hris_audit:
    name: hris_audit
