# HRIS-Lite — Docker deployment
#
# Quick start (SQLite, cocok uji coba / Ubuntu 24 tanpa MySQL):
#   cp .env.example .env && docker compose up -d --build
#
# Production (MySQL 8):
#   cp .env.example .env
#   docker compose --profile mysql up -d --build

name: hris-lite

services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.sqlite3}
      DB_NAME: ${DB_NAME:-/app/data/db.sqlite3}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-hris}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DEBUG: ${DEBUG:-False}
      HRIS_AUDIT_ARCHIVE_DIR: ${HRIS_AUDIT_ARCHIVE_DIR:-/app/audit_archive}
    volumes:
      - app_data:/app/data
      - media_data:/app/media
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hris_system}
      # User MySQL HARUS bukan root (batasan image mysql:8.0)
      MYSQL_USER: hris
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=67108864
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  cron:
    profiles: ["mysql"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.mysql}
      DB_NAME: ${DB_NAME:-hris_system}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: hris
      DB_PASSWORD: ${DB_PASSWORD:-hris_secret}
      HRIS_AUDIT_ARCHIVE_DIR: ${HRIS_AUDIT_ARCHIVE_DIR:-/app/audit_archive}
    volumes:
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint: ["/bin/sh", "/app/scripts/cron.sh"]

volumes:
  app_data:
  media_data:
  audit_archive:
  backups:
  mysql_data:
