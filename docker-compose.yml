# HRIS-Lite — Docker deployment
#
# Quick start (SQLite, uji coba / staging kecil):
#   cp .env.example .env
#   # Edit SECRET_KEY, HRIS_FIELD_ENCRYPTION_KEY, ALLOWED_HOSTS
#   docker compose up -d --build
#
# Production (MySQL 8 + Redis + worker + cron):
#   cp deploy/env.production.example .env
#   # Edit SECRET_KEY, HRIS_FIELD_ENCRYPTION_KEY, ALLOWED_HOSTS, DB_PASSWORD
#   docker compose --profile mysql up -d --build

name: hris-lite

services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.sqlite3}
      DB_NAME: ${DB_NAME:-/app/data/db.sqlite3}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hris}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DEBUG: ${DEBUG:-False}
      CORS_ALLOW_FLUTTER_DEV: ${CORS_ALLOW_FLUTTER_DEV:-True}
      HRIS_MEDIA_PROTECTED: ${HRIS_MEDIA_PROTECTED:-True}
      HRIS_AUDIT_ARCHIVE_DIR: ${HRIS_AUDIT_ARCHIVE_DIR:-/app/audit_archive}
      REDIS_URL: ${REDIS_URL:-}
      HRIS_PUNCH_ASYNC_RECALC: ${HRIS_PUNCH_ASYNC_RECALC:-False}
    volumes:
      - app_data:/app/data
      - media_data:/app/media
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hris_system}
      MYSQL_USER: ${DB_USER:-hris}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=536870912
      - --max-connections=300
      - --innodb-log-buffer-size=16777216
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    profiles: ["mysql"]
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    profiles: ["mysql"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.mysql}
      DB_NAME: ${DB_NAME:-hris_system}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hris}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HRIS_PUNCH_ASYNC_RECALC: ${HRIS_PUNCH_ASYNC_RECALC:-True}
      HRIS_AUDIT_ARCHIVE_DIR: ${HRIS_AUDIT_ARCHIVE_DIR:-/app/audit_archive}
    volumes:
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: ["python", "manage.py", "rqworker", "punch", "default", "--verbosity", "1"]

  cron:
    profiles: ["mysql"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.mysql}
      DB_NAME: ${DB_NAME:-hris_system}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hris}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      HRIS_AUDIT_ARCHIVE_DIR: ${HRIS_AUDIT_ARCHIVE_DIR:-/app/audit_archive}
    volumes:
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint: ["/bin/sh", "/app/scripts/cron.sh"]

volumes:
  app_data:
  media_data:
  audit_archive:
  backups:
  mysql_data:
