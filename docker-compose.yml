services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hris_lite}
      MYSQL_USER: ${DB_USER:-hris}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hris_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DEBUG: "False"
    volumes:
      - media_data:/app/media
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - web

  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: django.db.backends.mysql
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - audit_archive:/app/audit_archive
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/cron.sh"]

volumes:
  mysql_data:
  media_data:
  audit_archive:
  backups:
