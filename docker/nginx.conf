# Docker internal DNS — resolve ulang saat container web di-recreate (hindari 502 stale upstream)
resolver 127.0.0.11 ipv6=off valid=10s;

# CORS untuk Flutter web dev (localhost:port acak) → API publik, tanpa membuka portal admin
map $http_origin $cors_allow_origin {
    default "";
    "~^http://localhost:[0-9]+$" $http_origin;
    "~^http://127\.0\.0\.1:[0-9]+$" $http_origin;
}

upstream hris_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Proxy ke Django — HRIS_MEDIA_PROTECTED menegakkan auth/tenant ACL
    location /media/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-CSRFToken, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-CSRFToken, X-Requested-With" always;

        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
    }
}
