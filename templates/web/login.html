{% extends "base.html" %}

{% block title %}Login — HRIS-Lite{% endblock %}

{% block auth_content %}
<div class="flex min-h-full items-center justify-center px-4 py-12">
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900">HRIS-Lite</h1>
    <p class="mt-1 text-sm text-slate-500">Masuk ke portal HRD manufaktur</p>
    <form method="post" class="mt-8 space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{ form.non_field_errors }}</div>
      {% endif %}
      <div>
        <label class="block text-sm font-medium text-slate-700">Username</label>
        <input type="text" name="username" autofocus required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-800">
        Masuk
      </button>
    </form>
  </div>
</div>
{% endblock %}
