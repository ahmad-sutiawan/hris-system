{% if show_admin_nav %}
<a href="{% url 'web:manage_hub' %}" class="hris-nav-link hris-nav-link--admin-hub{% if request.path == '/manage/' %} is-active{% endif %}">
  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
  Admin Console
</a>
{% for app in admin_nav_apps %}
<div class="hris-nav-section hris-nav-section--admin">
  <div class="hris-nav-label">{{ app.section }}</div>
  {% for item in app.items %}
  <a href="{{ item.url }}" class="hris-nav-link hris-nav-link--admin{% if request.resolver_match.kwargs.slug|default:'' == item.slug %} is-active{% endif %}">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    {{ item.label }}
  </a>
  {% endfor %}
</div>
{% endfor %}
{% endif %}
